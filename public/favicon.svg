<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="觅音 Miyin M 波下探字母标（浅色）">
  <!--
    觅音 Miyin · 概念二「M 波下探」字母文字标 · 浅色版
    设计令牌：主 #0f766e / 深青 #134e4a / 透明底
    构成：圆头描边字母 M，两峰左高右低；中段 V 形即下潜通道（高亮色）；右竖笔末端接向下箭头缺口
  -->
  <!-- 左竖笔（左峰最高，y=13） -->
  <path d="M11 47 L11 13" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <!-- 中段 V 形 = 下潜通道（高亮 #134e4a，独立描边强调） -->
  <path d="M11 13 L31 39 L49 25" fill="none" stroke="#134e4a" stroke-width="6" stroke-linecap="round"/>
  <!-- 右竖笔（右峰更低，y=25；末端为向下箭头杆） -->
  <path d="M49 25 L49 47" fill="none" stroke="#0f766e" stroke-width="6" stroke-linecap="round"/>
  <!-- 向下箭头缺口（高亮 #134e4a）：下载动势 -->
  <path d="M43 47 L55 47 L49 55 Z" fill="#134e4a"/>
</svg>
