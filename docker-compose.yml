services:
  miyin:
    build: .
    ports:
      - "18980:18980"
    environment:
      AUTH_TOKEN: changeme
      SESSION_SECRET: please-change-me
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      HOST: 0.0.0.0
      PORT: 18980
    volumes:
      - ./data:/data
      - ./downloads:/downloads
    restart: unless-stopped
