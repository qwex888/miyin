services:
  miyin:
    image: miyin:latest
    container_name: miyin
    ports:
      - "3000:3000"
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-me}
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - miyin-data:/data
      - miyin-downloads:/downloads
    restart: unless-stopped

volumes:
  miyin-data:
  miyin-downloads:
